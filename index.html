<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preço do Token</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌵</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .pulse-loader {
            display: inline-block; width: 80px; height: 24px;
            background-color: #4b5563; border-radius: 0.25rem;
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
        
        <img src="https://img1.wsimg.com/isteam/ip/907be967-2098-4041-809a-0b718d662147/coin.jpeg/:/cr=t:6.91%25,l:4.97%25,w:89.29%25,h:89.29%25/rs=w:1000,h:1000,cg:true,m" 
             alt="Logo do Token" class="w-24 h-24 rounded-full mx-auto mb-6 shadow-lg border-2 border-gray-700">

        <h1 class="text-xl sm:text-2xl font-bold text-cyan-400 mb-2" id="token-name">$PRKL</h1>
        <p class="text-sm text-gray-400 mb-6">Preço em tempo real (USD)</p>

        <div class="my-4">
            <div class="text-4xl sm:text-6xl font-bold text-white" id="token-price">
                <span class="pulse-loader" style="height: 48px; width: 250px;"></span>
            </div>
        </div>

        <!-- Calculadora de Simulação -->
        <div class="mt-6 bg-gray-900 p-4 rounded-lg border border-gray-700 text-left">
            <div class="flex justify-between items-center mb-2">
                <label class="text-xs text-gray-400" id="input-label">Simular Compra (USD)</label>
                <button onclick="toggleMode()" class="text-cyan-400 hover:text-cyan-300 text-xs font-bold transition">⇅ Inverter</button>
            </div>
            <input type="number" id="calc-input" placeholder="0.00" 
                   class="w-full bg-gray-800 text-white p-2 rounded border border-gray-600 focus:outline-none focus:border-cyan-400">
            <div class="mt-3 text-sm text-gray-300">
                Resultado: <span id="calc-output" class="font-bold text-cyan-400">0.00</span> <span id="output-unit">PRKL</span>
            </div>
        </div>

        <div class="mt-6 mb-4">
            <a href="https://jup.ag/tokens/DAXG5d2cMsWRFSrRFVrpGpVNqmrNP4FbTQXbusNHzFCy" 
               target="_blank" rel="noopener noreferrer"
               class="inline-block bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-bold py-3 px-8 rounded-lg w-full text-lg shadow-lg transition-colors duration-200 transform hover:scale-105">
                Comprar
            </a>
        </div>

        <div class="mt-6 text-xs text-gray-500">
            Atualizado de: <a href="https://www.geckoterminal.com/" target="_blank" rel="noopener noreferrer" class="hover:text-cyan-400">GeckoTerminal</a>
            <p id="last-updated" class="mt-1">Atualizando...</p>
        </div>
    </div>

    <script>
        const apiUrl = 'https://api.geckoterminal.com/api/v2/networks/solana/pools/FuEHZ8rM3V5oYzyNpERZW9rCkR29gHYKnXtVLvJXLZjb';
        const priceElement = document.getElementById('token-price');
        const calcInput = document.getElementById('calc-input');
        const calcOutput = document.getElementById('calc-output');
        const inputLabel = document.getElementById('input-label');
        const outputUnit = document.getElementById('output-unit');
        const updatedElement = document.getElementById('last-updated');
        
        let currentPrice = 0;
        let isUsdToToken = true;

        function toggleMode() {
            isUsdToToken = !isUsdToToken;
            calcInput.value = '';
            calcOutput.textContent = '0.00';
            if (isUsdToToken) {
                inputLabel.textContent = 'Simular Compra (USD)';
                outputUnit.textContent = 'PRKL';
            } else {
                inputLabel.textContent = 'Quantidade de Tokens';
                outputUnit.textContent = 'USD';
            }
        }

        async function fetchPrice() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                currentPrice = parseFloat(data.data.attributes.base_token_price_usd);
                priceElement.textContent = currentPrice.toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 4 });
                updatedElement.textContent = `Última atualização: ${new Date().toLocaleTimeString()}`;
                calculate();
            } catch (error) {
                priceElement.textContent = 'Erro ao carregar';
            }
        }

        function calculate() {
            const val = parseFloat(calcInput.value);
            if (val > 0 && currentPrice > 0) {
                const total = isUsdToToken ? (val / currentPrice) : (val * currentPrice);
                calcOutput.textContent = total.toLocaleString('en-US', { maximumFractionDigits: isUsdToToken ? 2 : 4 });
            } else {
                calcOutput.textContent = '0.00';
            }
        }

        calcInput.addEventListener('input', calculate);
        fetchPrice();
        setInterval(fetchPrice, 30000);
    </script>
</body>
</html>
